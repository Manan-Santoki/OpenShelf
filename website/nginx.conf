server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The site moved from openshelf.msantoki.com; send old links to the new address.
    if ($host = openshelf.msantoki.com) {
        return 301 https://openshelf.space$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri/ =404;
    }

    # Unknown paths get a real 404 instead of the home page, so search engines don't index duplicates
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=300";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
