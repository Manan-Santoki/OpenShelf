name: CI

# Docs and the license don't affect the app, so changes to only
# those skip the build.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build
        run: make app

      - name: Test
        run: swift test
